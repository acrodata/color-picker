<section>
  <color-picker [(value)]="color" />

  <div class="input-group">
    <button
      cdkOverlayOrigin
      #trigger="cdkOverlayOrigin"
      [style.color]="color()"
      (click)="toggleMenu()"
    >
      <span></span>
    </button>
    <input type="text" [(ngModel)]="color" />
  </div>
</section>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="isOpen()"
  (overlayOutsideClick)="closeMenu()"
  (detach)="closeMenu()"
>
  <color-picker [(value)]="color" />
</ng-template>
